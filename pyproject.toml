[project]
name = "pm25-stgnn-thailand"
version = "0.1.0"
description = "Explainable Spatio-Temporal GNN for PM2.5 forecasting and source attribution in Northern Thailand. NSC 2026 entry."
readme = { file = "README.md", content-type = "text/markdown" }
requires-python = ">=3.11,<3.13"
license = { text = "MIT" }
authors = [
    { name = "NSC 2026 Team" },
]

# ============================================================================
# IMPORTANT — Native PyG extensions are NOT listed here.
#
# `torch-scatter`, `torch-sparse`, and `torch-geometric-temporal` require
# torch to exist BEFORE they can build/install. uv resolves all deps before
# any installs, so listing them here breaks `uv sync`.
#
# After `uv sync`, run: `./install_native_deps.ps1` (Windows) or
# `./install_native_deps.sh` (Linux/Mac) to install them via pip with the
# correct PyG wheel index.
# ============================================================================

dependencies = [
    # --- PyTorch stack (CUDA 12.6) ---
    "torch==2.6.0",
    "torchvision==0.21.0",

    # --- PyG core (pure Python wrapper, no native code) ---
    "torch-geometric>=2.6,<2.7",

    # --- Core scientific stack ---
    "numpy>=1.26,<2.0",
    "pandas>=2.2",
    "scipy>=1.12",
    "scikit-learn>=1.4",
    "pyarrow>=15.0",
    "xarray>=2024.0",
    "netcdf4>=1.6",
    "dask[complete]>=2024.0",

    # --- Data acquisition ---
    "requests>=2.31",
    "beautifulsoup4>=4.12",
    "lxml>=5.0",
    "cdsapi>=0.7",
    "tenacity>=8.2",

    # --- Experiment tracking & config ---
    "hydra-core>=1.3",
    "omegaconf>=2.3",
    "wandb>=0.16",

    # --- Visualization ---
    "matplotlib>=3.8",
    "plotly>=5.20",
    "folium>=0.16",
    "seaborn>=0.13",

    # --- Demo ---
    "streamlit>=1.32",
    "streamlit-folium>=0.18",

    # --- XAI ---
    "shap>=0.45",
    "captum>=0.7",

    # --- Utility ---
    "typer>=0.12",
    "rich>=13.7",
    "python-dotenv>=1.0",
    "tqdm>=4.66",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=4.1",
    "pytest-mock>=3.12",
    "requests-mock>=1.11",
    "ruff>=0.4",
    "black>=24.0",
    "mypy>=1.9",
    "ipykernel>=6.29",
    "jupyterlab>=4.1",
]

# --- uv: fetch torch from PyTorch's CUDA 12.6 index ---
[[tool.uv.index]]
name = "pytorch-cu126"
url = "https://download.pytorch.org/whl/cu126"
explicit = true

[tool.uv.sources]
torch = [
    { index = "pytorch-cu126", marker = "sys_platform == 'win32' or sys_platform == 'linux'" },
]
torchvision = [
    { index = "pytorch-cu126", marker = "sys_platform == 'win32' or sys_platform == 'linux'" },
]

[tool.black]
line-length = 100
target-version = ["py311"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "C90", "N", "UP", "S", "ANN", "RUF"]
ignore = ["ANN101", "ANN102"]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["S101", "ANN"]
"notebooks/**/*.py" = ["ANN", "E402"]
"scripts/**/*.py" = ["S101"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v --cov=src --cov-report=term-missing --cov-report=html"
python_files = ["test_*.py"]
filterwarnings = [
    "ignore::DeprecationWarning",
    "ignore::PendingDeprecationWarning",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]
